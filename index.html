<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>JellyFlix - Watch TV Shows & Movies Online</title>
    <meta name="description" content="A cinematic Netflix-style media player powered by Jellyfin media server" />
    
    <!-- Cross-platform Theme Color -->
    <meta name="theme-color" content="#141414" />
    <meta name="color-scheme" content="dark" />

    <!-- General / Android PWA Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="JellyFlix" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple iOS / iPadOS PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JellyFlix" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />

    <!-- Microsoft Windows PWA Meta Tags -->
    <meta name="msapplication-TileColor" content="#141414" />
    <meta name="msapplication-TileImage" content="/icons/pwa-144x144.png" />
    <meta name="msapplication-config" content="none" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Capture PWA beforeinstallprompt immediately on boot
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
