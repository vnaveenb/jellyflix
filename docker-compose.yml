services:
  jellyflix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyflix
    restart: unless-stopped
    ports:
      - "8098:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Where this container proxies /jellyfin-api to. Applied at container start.
      - JELLYFIN_UPSTREAM=http://host.docker.internal:8097
