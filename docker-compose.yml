services:
  jellyflix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyflix
    restart: unless-stopped
    ports:
      - "8098:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_JELLYFIN_URL=http://host.docker.internal:8097
